name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.3.14

      # vsce spawns npm internally, so Node has to be on PATH as well.
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22

      - run: bun install --frozen-lockfile

      - run: bun run typecheck
      - run: bun run lint
      - run: bun run format:check
      - run: bun run test:coverage

  package:
    name: Package
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22

      - run: bun install --frozen-lockfile

      # Always go through the package script: it runs build:prod first, so the
      # bundle in the VSIX is minified.
      - run: bun run package

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: vsix
          path: "*.vsix"
          if-no-files-found: error
